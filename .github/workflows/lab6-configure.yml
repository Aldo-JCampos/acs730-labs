name: lab6-configure
 
# Scoped to this lab's folder, so a push to lab5/ does not start it.
# Apply is manual only: this workflow creates real infrastructure, and
# a $50 term budget does not survive an apply on every push.
on:
  push:
    paths:
      - 'lab6/**'
      - '.github/workflows/lab6-configure.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually create infrastructure (costs money)"
        type: boolean
        default: false
 
permissions:
  contents: read
 
env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
 
jobs:
  configure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6/terraform
 
    steps:
      - uses: actions/checkout@v4
 
      # Tooling goes in BEFORE provisioning, so nothing sits between
      # "apply" and "converge". boto3 and botocore go into the SAME
      # interpreter ansible-core was installed into, or the aws_ec2
      # plugin reports them missing while pip insists they are there.
      - name: Install Ansible, the AWS collections and boto3
        run: |
          python3 -m pip install --quiet "ansible-core>=2.16" boto3 botocore
          ansible-galaxy collection install amazon.aws community.aws
 
      # pip does not ship this. It is a native binary, the aws_ssm
      # connection plugin shells out to it for every task, and a clean
      # runner never has it.
      - name: Install the SSM Session Manager plugin
        run: |
          curl -sSfL -o /tmp/ssm.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/ssm.deb
          session-manager-plugin --version
 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false
 
      - name: terraform init
        run: terraform init -input=false
 
      - name: terraform plan
        run: terraform plan -input=false
 
      - name: terraform apply
        if: inputs.apply
        run: terraform apply -input=false -auto-approve
 
      # THE GRADED STEP: nothing between this and the apply above.
      - name: Converge the instances with Ansible
        if: inputs.apply
        working-directory: lab6/ansible
        run: |
          for i in $(seq 1 30); do
            ansible -i inventory/ role_web -m ansible.builtin.ping && break
            echo "waiting for the SSM agent to register ($i/30)"; sleep 10
          done
          ansible-playbook -i inventory/ site.yml -l role_web
