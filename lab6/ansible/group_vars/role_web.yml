---
# Reach these hosts through Systems Manager instead of SSH.
ansible_connection: aws_ssm
 
# Both of these must name the same region as the bucket itself.
ansible_aws_ssm_region: us-east-1
ansible_aws_ssm_bucket_name: acs730-lab6-ssm-615313524491
 
# A writable path on the target for the session's temporary files.
ansible_aws_ssm_s3_addressing_style: virtual
ansible_remote_tmp: /tmp/.ansible-ssm
ansible_python_interpreter: /usr/bin/python3
